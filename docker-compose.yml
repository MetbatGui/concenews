x-backend-image: &backend-image
  image: concenews-backend:local
  build:
    context: ./concenews-backend

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: concenews
      POSTGRES_PASSWORD: concenews
      POSTGRES_DB: concenews
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U concenews"]
      interval: 5s
      timeout: 5s
      retries: 5

  migrate:
    <<: *backend-image
    command: ["alembic", "upgrade", "head"]
    environment:
      DATABASE_URL: postgresql+psycopg://concenews:concenews@postgres:5432/concenews
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    <<: *backend-image
    command: ["uvicorn", "src.main:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      DATABASE_URL: postgresql+psycopg://concenews:concenews@postgres:5432/concenews
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "8000:8000"

  scheduler:
    <<: *backend-image
    command: ["python", "-m", "src.scheduler_main"]
    environment:
      DATABASE_URL: postgresql+psycopg://concenews:concenews@postgres:5432/concenews
      THENEWSAPI_TOKEN: ${THENEWSAPI_TOKEN:-}
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  postgres_data:
